name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hackathon
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: hackathon
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hackathon"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B package

      - name: Build Docker image
        run: docker build -t hackathon-backend:${{ github.sha }} .
